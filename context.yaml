$schema: 'https://raw.githubusercontent.com/context-hub/generator/refs/heads/main/json-schema.json'
documents:
  -
    description: 'Node.js Pi Extension Project Structure'
    outputPath: docs/node-structure.md
    overwrite: true
    sources:
      -
        type: tree
        description: 'Node.js Pi Extension Directory Structure'
        sourcePaths:
          - src
          - extensions
          - skills
          - test
        filePattern: '*'
        renderFormat: ascii
        enabled: true
        showCharCount: true
        maxDepth: 3
